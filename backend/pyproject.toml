[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mullen_ai_jarvis"
version = "0.0.1"
description = "Secure local-first AI executive assistant"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Jim Mullen" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "rq>=1.16",
    "redis>=5.0",
    "httpx>=0.27",
    "keyring>=25.5",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
    "ollama>=0.4",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]
voice = [
    # ~150MB Whisper base.en model download on first use
    "faster-whisper>=1.0",
    # Piper voice .onnx files (~70MB each) downloaded separately
    # from https://github.com/rhasspy/piper#voices
    "piper-tts>=1.2",
]
cloud = [
    "anthropic>=0.39",
    "openai>=1.54",
]
automation = [
    "playwright>=1.48",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
